{% extends "base.html" %}

{% block title %}{{ doc.title }} — {{ site.title }}{% endblock %}

{% block content %}
<div class="home">
  <h1 class="home-title">{{ doc.title }}</h1>
  <p class="home-subtitle"><span class="doc-path">{{ doc.id }}</span></p>
  <p>This page is indexed for search but lives outside the atlas.</p>
  <p>
    <a class="external-open" href="/raw/{{ doc.id }}" target="_blank" rel="noopener">
      Open the page →
    </a>
  </p>
  {% if artifact_link %}
  <p><a class="external-open" href="{{ artifact_link[1] }}" target="_blank" rel="noopener">
    {{ artifact_link[0] }} →</a></p>
  {% endif %}
</div>
{% endblock %}

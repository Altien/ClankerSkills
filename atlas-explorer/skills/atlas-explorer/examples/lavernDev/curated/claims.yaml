# Quantitative documentation claims, checked deterministically on every index.
# Seeded from TECH_DEBT_AUDIT.md's known CLAUDE.md drift; counters re-verified
# against the tree on 2026-06-04. `expected` is what the DOC says — a fail
# means the doc has drifted from the tree.

- id: claude-md-route-modules
  doc: CLAUDE.md
  quote: "26 route modules"
  counter: { type: file_count, glob: "src/api/routes/*.ts" }
  expected: 26
  note: "TECH_DEBT_AUDIT flagged this drifting 20→27; corrected to the tree's 26 when the Atlas landed."

